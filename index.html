<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Aura Preview</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d0f; color: #eef2f4; }
    main { width: min(680px, calc(100% - 40px)); }
    i { display: block; width: 14px; height: 14px; border: 2px solid #b7f34a; border-radius: 50%; box-shadow: 0 0 24px rgba(183,243,74,.45); }
    h1 { margin: 28px 0 12px; font-size: clamp(38px, 10vw, 72px); letter-spacing: -.05em; }
    p { color: #9aa4ab; font-size: 17px; line-height: 1.6; }
    .status { margin-top: 32px; padding-top: 18px; border-top: 1px solid #23282d; color: #b7f34a; font: 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <i></i>
    <h1>Open Aura</h1>
    <p>手机 Review 预览站已经建立。这里将自动展示私有 OpenAura 仓库中经过筛选的 Web 界面，不包含源代码、内部文档或真实协作数据。</p>
    <div class="status">PREVIEW ONLINE · INITIAL DEPLOYMENT</div>
  </main>
</body>
</html>
